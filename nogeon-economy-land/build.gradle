processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "forge_version", project.forge_version

    filesMatching("META-INF/mods.toml") {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            forge_version: project.forge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

jar {
    manifest {
        attributes([
            "MixinConfigs": "nogeon_economy_land.mixins.json"
        ])
    }
}

tasks.register("printClasspath") {
    doLast {
        configurations.compileClasspath.each { println it.absolutePath }
    }
}

tasks.register("decompileTacz") {
    doLast {
        def urls = configurations.compileClasspath.collect { it.toURI().toURL() }
        file("../mods").listFiles().each { 
            if (it.name.endsWith(".jar")) {
                urls.add(it.toURI().toURL())
            }
        }
        def loader = new URLClassLoader(urls as URL[], ClassLoader.getSystemClassLoader())
        def classes = [
            "net.minecraftforge.event.entity.player.ItemFishedEvent"
        ]
        classes.each { className ->
            try {
                Class<?> clazz = loader.loadClass(className)
                println "================ Class: ${className} ================"
                println "Constructors:"
                clazz.declaredConstructors.each { println "  " + it }
                println "Methods:"
                clazz.declaredMethods.each { println "  " + it }
                println "Fields:"
                clazz.declaredFields.each { println "  " + it }
            } catch (Throwable e) {
                println "Failed for ${className}: ${e.message}"
                e.printStackTrace()
            }
        }
    }
}

tasks.register("findTaczClasses") {
    doLast {
        def taczJar = configurations.compileClasspath.find { it.name.contains("tacz") }
        if (taczJar) {
            println "Found tacz jar: ${taczJar.absolutePath}"
            def zip = new java.util.zip.ZipFile(taczJar)
            zip.entries().each { entry ->
                if (entry.name.endsWith(".class") && entry.name.contains("tacz")) {
                    def className = entry.name.replace('/', '.').substring(0, entry.name.length() - 6)
                    if (className.contains("Shooter") || className.contains("Operator") || className.contains("Shoot") || className.contains("Gun")) {
                        println className
                    }
                }
            }
        } else {
            println "Tacz jar not found in classpath!"
        }
    }
}



